hydra:
  output_subdir: null

arch:
  name: trm@TinyRecursiveReasoningModel
  halt_exploration_prob: 0.1
  halt_max_steps: 16
  H_cycles: 3
  L_cycles: 4
  H_layers: 0
  L_layers: 2
  hidden_size: 512
  num_heads: 8
  expansion: 4
  puzzle_emb_ndim: ${arch.hidden_size}
  forward_dtype: bfloat16
  puzzle_emb_len: 16

data_paths: ["data/maze-30x30-hard-1k"]
data_paths_test: []

evaluators: []

global_batch_size: 192

epochs: 50000
eval_interval: 5000
checkpoint_every_eval: true

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

beta1: 0.9
beta2: 0.95
weight_decay: 1.0
puzzle_emb_weight_decay: 1.0

puzzle_emb_lr: 1e-4

seed: 0
min_eval_interval: 0

ema: true
ema_rate: 0.999
freeze_weights: false

project_name: null
run_name: null
load_checkpoint: null
checkpoint_path: null

eval_save_outputs: []
